<!DOCTYPE html>
<html lang="en-GB" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck</title>
<script>
  // Reapply the last theme before first paint. The server stays the source of
  // truth; this only stops a flash of the wrong colours while loading.
  try {
    const cached = localStorage.getItem('deck-theme');
    if (cached) document.documentElement.dataset.theme = cached;
  } catch {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="auto"] {
    --paper: #E7E8EC;
    --surface: #FBFBFC;
    --ink: #171A20;
    --muted: #6C7280;
    --rule: #D3D6DD;
    --danger: #A32B22;
    --a1: #2C43C9;
    --a2: #0F766E;
    --a3: #6D3FC4;
    --a4: #5C6B2F;
    --a5: #4A4F5C;
    --action: #171A20;
    --action-text: #FBFBFC;
    --radius: 3px;
    --glow: none;
    --shadow: 0 1px 2px rgba(23, 26, 32, .06), 0 6px 18px rgba(23, 26, 32, .05);
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }

  @media (prefers-color-scheme: dark) {
    [data-theme="auto"] {
      --paper: #14161B;
      --surface: #1C1F27;
      --ink: #E9EAEE;
      --muted: #8F95A3;
      --rule: #2A2E38;
      --danger: #FF8F84;
      --a1: #8093FF;
      --a2: #3FBFAE;
      --a3: #B69BFF;
      --a4: #A8B96A;
      --a5: #9BA2B0;
      --action: #E9EAEE;
      --action-text: #14161B;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .22);
    }
  }

  [data-theme="dark"] {
    --paper: #14161B;
    --surface: #1C1F27;
    --ink: #E9EAEE;
    --muted: #8F95A3;
    --rule: #2A2E38;
    --danger: #FF8F84;
    --a1: #8093FF;
    --a2: #3FBFAE;
    --a3: #B69BFF;
    --a4: #A8B96A;
    --a5: #9BA2B0;
    --action: #E9EAEE;
    --action-text: #14161B;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .22);
  }

  [data-theme="pastel"] {
    --paper: #FFF0F6;
    --surface: #FFFFFF;
    --ink: #4E2A3E;
    --muted: #B47C9A;
    --rule: #FBD8E7;
    --danger: #D1477A;
    --a1: #E4649E;
    --a2: #A98FC4;
    --a3: #4FB39C;
    --a4: #E0894F;
    --a5: #6E9BDD;
    --action: #E4649E;
    --action-text: #FFFFFF;
    --radius: 14px;
    --glow: 0 0 0 6px rgba(228, 100, 158, .09);
    --shadow: 0 1px 2px rgba(196, 120, 158, .12), 0 8px 22px rgba(196, 120, 158, .16);
  }

  [data-theme="pastel"] body {
    background-image:
      radial-gradient(60% 45% at 88% 0%, rgba(255, 214, 232, .95), transparent 70%),
      radial-gradient(50% 40% at 4% 8%, rgba(226, 216, 255, .7), transparent 72%);
    background-attachment: fixed;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 24px 80px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 980px; margin: 0 auto; }

  .masthead {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--rule);
  }

  h1 {
    font-family: var(--display);
    font-weight: 600;
    font-size: 40px;
    letter-spacing: -.02em;
    margin: 0;
  }

  .tally {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 4px 0 0;
  }

  .readonly {
    margin-left: 10px;
    padding: 2px 8px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    color: var(--muted);
  }
  .readonly[hidden] { display: none; }

  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .picker {
    font-family: var(--body);
    font-size: 14px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 9px 14px;
    max-width: 190px;
    cursor: pointer;
  }
  .picker:hover { border-color: var(--muted); }

  .draw-any {
    font-family: var(--body);
    font-size: 15px;
    font-weight: 500;
    color: var(--action-text);
    background: var(--action);
    border: 0;
    border-radius: 999px;
    padding: 11px 22px;
    cursor: pointer;
    transition: opacity .15s ease;
  }
  .draw-any:hover { opacity: .84; }
  .draw-any:disabled { opacity: .35; cursor: default; }

  .settings {
    display: grid;
    gap: 12px;
    margin-top: 18px;
    padding: 16px 18px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .settings[hidden] { display: none; }

  .setting { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }

  .setting-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    width: 78px;
    flex: none;
  }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips[hidden] { display: none; }

  .chip {
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.4;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--rule);
    background: none;
    color: var(--muted);
    cursor: pointer;
  }
  .chip:hover { color: var(--ink); border-color: var(--muted); }
  .chip[aria-pressed="true"] {
    background: var(--action);
    color: var(--action-text);
    border-color: var(--action);
  }
  .chip:disabled { opacity: .4; cursor: default; }
  .chip.danger { color: var(--danger); }

  .mins, .name-field {
    font-family: var(--mono);
    font-size: 12px;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--muted);
    background: var(--surface);
    color: var(--ink);
  }
  .mins { width: 62px; }
  .pass { width: 120px; font-family: var(--body); }
  .name-field { width: 180px; font-family: var(--body); }
  /* Same box as a chip, minus the visible border, so the text sits on the same
     line as the Lock button and starts at the same edge as every other row. */
  .mode-state {
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.4;
    padding: 5px 11px;
    border: 1px solid transparent;
    color: var(--muted);
    align-self: center;
  }

  .columns {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
    gap: 26px;
    margin-top: 32px;
    align-items: start;
  }

  .col { --accent: var(--a1); min-width: 0; }

  .col-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--rule);
  }

  .col-icon {
    background: none;
    border: 0;
    padding: 2px;
    cursor: pointer;
    color: var(--accent);
    display: grid;
    place-items: center;
  }
  .col-icon svg { width: 17px; height: 17px; display: block; }
  .col-icon:hover { opacity: .7; }
  span.col-icon { cursor: default; }
  span.col-icon:hover { opacity: 1; }

  .col-name {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent);
    overflow-wrap: anywhere;
  }

  .col-count {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    margin-right: auto;
  }

  .draw-col {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .04em;
    background: none;
    border: 0;
    color: var(--muted);
    cursor: pointer;
    padding: 4px 2px;
    text-transform: uppercase;
  }
  .draw-col:hover { color: var(--ink); }
  .draw-col:disabled { opacity: .3; cursor: default; }

  .col-tools { display: flex; gap: 1px; opacity: 0; transition: opacity .15s ease; }
  .col:hover .col-tools, .col:focus-within .col-tools { opacity: 1; }
  .col-tools .tool.confirming {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--danger);
    padding: 3px 6px;
  }

  .palette {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 10px;
    padding: 8px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .palette[hidden] { display: none; }

  .swatch {
    background: none;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 6px;
    cursor: pointer;
    color: var(--muted);
    display: grid;
    place-items: center;
  }
  .swatch svg { width: 17px; height: 17px; display: block; }
  .swatch:hover { color: var(--ink); border-color: var(--rule); }
  .swatch[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }

  .stack {
    list-style: none;
    margin: 14px 0 0;
    padding: 0;
    display: grid;
    gap: 8px;
    min-height: 56px;
  }

  .card {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-left: 2px solid var(--accent);
    border-radius: var(--radius);
    padding: 12px 12px 12px 6px;
    box-shadow: var(--shadow);
  }
  .card.dragging { opacity: .35; border-style: dashed; box-shadow: none; }
  .locked .card { padding-left: 12px; }

  .grip {
    flex: none;
    padding: 2px 4px;
    color: var(--muted);
    cursor: grab;
    opacity: .5;
    touch-action: none;
  }
  .card:hover .grip { opacity: 1; }
  .grip:active { cursor: grabbing; }
  .grip svg { width: 14px; height: 16px; display: block; }

  .card-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }

  .card-tools { display: flex; gap: 2px; opacity: .45; transition: opacity .15s ease; }
  .card:hover .card-tools, .card:focus-within .card-tools { opacity: 1; }

  .tool {
    background: none;
    border: 0;
    padding: 4px;
    border-radius: 3px;
    cursor: pointer;
    color: var(--muted);
    display: grid;
    place-items: center;
  }
  .tool:hover { color: var(--ink); background: var(--paper); }
  .tool svg { width: 15px; height: 15px; display: block; }

  .empty { font-size: 14px; color: var(--muted); padding: 14px 0; margin: 0; }

  .add {
    margin-top: 8px;
    width: 100%;
    text-align: left;
    background: none;
    border: 1px dashed var(--rule);
    border-radius: var(--radius);
    color: var(--muted);
    font-family: var(--body);
    font-size: 14px;
    padding: 11px 14px;
    cursor: pointer;
  }
  .add:hover { color: var(--ink); border-color: var(--muted); }

  .col.new { padding-top: 1px; }
  .col.new .palette { margin-top: 8px; }

  .field {
    width: 100%;
    font-family: var(--body);
    font-size: 15px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--muted);
    border-radius: var(--radius);
    padding: 12px 13px;
    margin-top: 8px;
  }
  .card .field { margin: -3px 0 0; padding: 4px 6px; }
  .col-head .field { margin: 0; padding: 3px 7px; font-size: 13px; }

  .hint { font-family: var(--mono); font-size: 11px; color: var(--muted); margin: 6px 0 0; }

  .sheet {
    position: fixed;
    inset: 0;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: blur(3px);
    display: grid;
    place-items: center;
    padding: 24px;
    z-index: 10;
  }
  .sheet[hidden] { display: none; }

  .drawn {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-top: 3px solid var(--accent);
    border-radius: calc(var(--radius) + 2px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, .18), var(--glow);
    width: min(460px, 100%);
    padding: 30px 30px 24px;
    animation: deal .34s cubic-bezier(.2, .9, .25, 1);
  }

  @keyframes deal {
    from { transform: translateY(22px) rotate(-1.6deg); opacity: 0; }
    to { transform: none; opacity: 1; }
  }

  .drawn-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .drawn-label svg { width: 16px; height: 16px; display: block; color: var(--accent); flex: none; }

  .drawn-text {
    font-family: var(--display);
    font-weight: 400;
    font-size: 30px;
    line-height: 1.2;
    letter-spacing: -.015em;
    margin: 16px 0 26px;
  }

  .clock {
    font-family: var(--mono);
    font-size: 34px;
    letter-spacing: -.01em;
    margin: 0 0 18px;
  }
  .clock[hidden] { display: none; }

  /* When time is up the clock takes the card's accent and breathes a couple of
     times, so it reads across the room and still works with sound off. Reduced
     motion strips the animation and leaves the colour. */
  .clock.rang { color: var(--accent); animation: rang 1.1s ease-out 3; }

  @keyframes rang {
    0%, 100% { opacity: 1; }
    50% { opacity: .35; }
  }

  .done { font-size: 14px; color: var(--muted); margin: -8px 0 18px; }
  .done[hidden] { display: none; }

  .drawn-alarm { margin: 0 0 14px; }

  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.4;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--rule);
    background: none;
    color: var(--muted);
    cursor: pointer;
  }
  .toggle:hover { color: var(--ink); border-color: var(--muted); }
  .toggle[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  .toggle svg { width: 14px; height: 14px; display: block; }

  .drawn-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    border-top: 1px solid var(--rule);
    padding-top: 18px;
  }

  .btn {
    font-family: var(--body);
    font-size: 14px;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--rule);
    background: none;
    color: var(--ink);
    cursor: pointer;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--action); color: var(--action-text); border-color: var(--action); }
  .btn.primary:hover { opacity: .84; }
  .btn.quiet { border-color: transparent; color: var(--muted); margin-left: auto; }
  .btn.quiet:hover { color: var(--ink); }
  .btn.icon { padding: 9px; display: grid; place-items: center; color: var(--muted); }
  .btn.icon svg { width: 15px; height: 15px; display: block; }
  .btn.icon:hover { color: var(--ink); }
  .btn.icon[aria-expanded="true"] { color: var(--ink); border-color: var(--muted); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 999px;
    z-index: 20;
  }
  .toast[hidden] { display: none; }

  :focus-visible { outline: 2px solid var(--a1); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div>
      <h1>Deck</h1>
      <p class="tally" id="tally"><span id="tallyCount">Loading</span><span class="readonly" id="readonly" hidden>Read only</span></p>
    </div>
    <div class="controls">
      <select class="picker" id="picker" aria-label="Which deck"></select>
      <button class="btn icon" id="cog" type="button" aria-expanded="false" aria-controls="settings" aria-label="Settings">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.35 3.92 L6.32 1.72 L9.68 1.72 L9.65 3.92 L10.71 4.53 L12.6 3.4 L14.28 6.32 L12.36 7.39 L12.36 8.61 L14.28 9.68 L12.6 12.6 L10.71 11.47 L9.65 12.08 L9.68 14.28 L6.32 14.28 L6.35 12.08 L5.29 11.47 L3.4 12.6 L1.72 9.68 L3.64 8.61 L3.64 7.39 L1.72 6.32 L3.4 3.4 L5.29 4.53 Z" />
            <circle cx="8" cy="8" r="2.3" />
          </g>
        </svg>
      </button>
      <button class="btn" id="newDeck" type="button" hidden>New deck</button>
      <button class="btn" id="newColumn" type="button" hidden>New column</button>
      <button class="draw-any" id="drawAny" type="button">Draw a card</button>
    </div>
  </header>

  <section class="settings" id="settings" hidden>
    <div class="setting">
      <span class="setting-label">Timer</span>
      <div class="chips" id="chips"></div>
      <input class="mins" id="custom" type="number" min="1" max="180" inputmode="numeric" aria-label="Timer minutes">
    </div>
    <div class="setting">
      <span class="setting-label">Alarm</span>
      <div class="chips" id="alarms"></div>
    </div>
    <div class="setting">
      <span class="setting-label">Look</span>
      <div class="chips" id="themes"></div>
    </div>
    <div class="setting">
      <span class="setting-label">Click away</span>
      <div class="chips" id="clickaways"></div>
    </div>
    <div class="setting">
      <span class="setting-label">Write mode</span>
      <div class="chips" id="lockedControls">
        <input class="mins pass" id="password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password">
        <button class="chip" id="unlock" type="button">Unlock</button>
      </div>
      <div class="chips" id="unlockedControls" hidden>
        <span class="mode-state">On</span>
        <button class="chip" id="lock" type="button">Lock</button>
      </div>
    </div>
    <div class="setting">
      <span class="setting-label">Deck</span>
      <div class="chips" id="deckChips" hidden>
        <button class="chip" id="renameDeck" type="button">Rename</button>
        <button class="chip danger" id="deleteDeck" type="button">Delete</button>
      </div>
    </div>
  </section>

  <div class="columns" id="columns"></div>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="drawnText">
  <div class="drawn" id="drawn">
    <p class="drawn-label">
      <span id="drawnIcon"></span>
      <span id="drawnMode"></span>
    </p>
    <p class="drawn-text" id="drawnText"></p>
    <p class="clock" id="clock" hidden>20:00</p>
    <p class="done" id="doneNote" hidden></p>
    <p class="drawn-alarm">
      <button class="toggle" id="sheetAlarm" type="button" aria-pressed="true">
        <span id="sheetAlarmIcon"></span>
        <span id="sheetAlarmText">Alarm on</span>
      </button>
    </p>
    <div class="drawn-actions">
      <button class="btn primary" id="timerBtn" type="button">Start 20 minutes</button>
      <button class="btn" id="again" type="button">Draw again</button>
      <button class="btn quiet" id="close" type="button">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
// Must match BUILD in core.js. A mismatch means one side is a stale deployment.
const BUILD = '2026-08-17';

const STROKE = 'fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"';

const ICONS = {
  stack: '<g fill="currentColor"><rect x="2.5" y="3" width="11" height="2.6" rx="1.3"/><rect x="2.5" y="6.7" width="11" height="2.6" rx="1.3"/><rect x="2.5" y="10.4" width="11" height="2.6" rx="1.3"/></g>',
  music: '<g fill="currentColor"><rect x="2" y="6" width="2.6" height="8" rx="1.3"/><rect x="6.7" y="2" width="2.6" height="12" rx="1.3"/><rect x="11.4" y="8" width="2.6" height="6" rx="1.3"/></g>',
  quiet: '<rect x="1.5" y="7.3" width="13" height="1.4" rx=".7" fill="currentColor"/>',
  bed: `<g ${STROKE}><path d="M2 13V4.4M2 8.6h8.6a3.4 3.4 0 0 1 3.4 3.4V13M4.7 6.5h2.2"/></g>`,
  bolt: '<path d="M9.6 1.4 3.5 9.3h3.4l-.7 5.3 6.3-8.1H9.1z" fill="currentColor"/>',

const ICON_ORDER = Object.keys(ICONS);
const ACCENTS = ['var(--a1)', 'var(--a2)', 'var(--a3)', 'var(--a4)', 'var(--a5)'];
const PRESETS = [5, 10, 20, 30, 45, 60];
const THEMES = [['auto', 'Auto'], ['dark', 'Dark'], ['pastel', 'Pastel']];
// Labels read On/Off to match the toggle on the card. The stored values stay
// chime/silent, so a preference already saved in a browser still applies.
const ALARMS = [['chime', 'On'], ['silent', 'Off']];
const ALARM_NAMES = new Set(ALARMS.map(([value]) => value));
const CLICKAWAYS = [['save', 'Save'], ['discard', 'Discard']];
const CLICKAWAY_NAMES = new Set(CLICKAWAYS.map(([value]) => value));
const THEME_NAMES = new Set(THEMES.map(([value]) => value));

// A rising three-note figure, said twice, the second time more quietly. Notes
// rather than a buzzer: it should tell you the time is up without making you
// jump. Frequencies are C5, E5, G5.
const PHRASE = [[523.25, 0], [659.25, 0.55], [783.99, 1.1]];
const PASSES = [[0, 0.14], [2.2, 0.09]];

const TOOLS = {
  grip: '<path d="M5.5 3.2h.01M5.5 8h.01M5.5 12.8h.01M10.5 3.2h.01M10.5 8h.01M10.5 12.8h.01" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
  edit: '<path d="M11.5 2.5a1.6 1.6 0 0 1 2.3 2.3l-8 8L2.5 14l1.2-3.3z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>',
  move: '<path d="M5.5 3.5 2.5 6.5l3 3M2.5 6.5H13M10.5 12.5l3-3-3-3M13.5 9.5H3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>',
  remove: '<path d="M3.5 4.5h9M6.5 4.5V3h3v1.5M5 4.5l.6 8.5h4.8L11 4.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>',
};

/* Preferences. All four live in this browser, never on the server: the deck is
   shared between machines, how you like to look at it is not. That also means
   they can be changed while the deck is read only. */

const PREF = {
  theme: 'deck-theme',
  minutes: 'deck-minutes',
  alarm: 'deck-alarm',
  deck: 'deck-current',
  clickAway: 'deck-clickaway',
};

function readPref(key, fallback, valid) {
  try {
    const stored = localStorage.getItem(key);
    return valid(stored) ? stored : fallback;
  } catch {
    return fallback;
  }
}

function savePref(key, value) {
  try { localStorage.setItem(key, value); } catch {}
}

let cards = [];
let decks = [];
let columns = [];
let canWrite = false;
let lastDrawnId = null;
let timer = null;
let deadline = null;

const isMinutes = (v) => Number.isInteger(Number(v)) && Number(v) >= 1 && Number(v) <= 180;

let theme = readPref(PREF.theme, 'auto', (v) => THEME_NAMES.has(v));
let alarm = readPref(PREF.alarm, 'chime', (v) => ALARM_NAMES.has(v));
let minutes = Number(readPref(PREF.minutes, '20', isMinutes));
let deckId = readPref(PREF.deck, null, (v) => Boolean(v)); // checked against the decks once they load
let clickAway = readPref(PREF.clickAway, 'save', (v) => CLICKAWAY_NAMES.has(v));
let remaining = minutes * 60;

// Enter always saves and Escape always discards. This only decides what walking
// away from a half-finished field does.
const savesOnBlur = () => clickAway === 'save';

let audio = null;
let ringing = null;
let dragging = null;
let confirmingDeckDelete = false;

const el = {
  tallyCount: document.getElementById('tallyCount'),
  readonly: document.getElementById('readonly'),
  picker: document.getElementById('picker'),
  cog: document.getElementById('cog'),
  settings: document.getElementById('settings'),
  chips: document.getElementById('chips'),
  custom: document.getElementById('custom'),
  themes: document.getElementById('themes'),

  clickaways: document.getElementById('clickaways'),

  lockedControls: document.getElementById('lockedControls'),
  unlockedControls: document.getElementById('unlockedControls'),

  newColumn: document.getElementById('newColumn'),

let toastTimer = null;
function toast(message) {
  el.toast.textContent = message;
  el.toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.toast.hidden = true; }, 3400);
}

async function api(path, options = {}) {
  let res;
  try {
    res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
  } catch {
    throw new Error('Cannot reach the server. Is it still running?');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

const svg = (markup) => `<svg viewBox="0 0 16 16" aria-hidden="true">${markup}</svg>`;
const iconSvg = (name) => svg(ICONS[name] ?? ICONS.stack);
const toolSvg = (name) => svg(TOOLS[name]);

const myColumns = () => columns.filter((col) => col.deck === deckId);
const inColumn = (id) => cards.filter((card) => card.column === id);
const inDeck = () => cards.filter((card) => card.deck === deckId);

/* Rendering -------------------------------------------------------------- */

function paletteMarkup(selected) {
  return ICON_ORDER.map((name) => `
    <button class="swatch" type="button" data-icon="${name}" aria-label="${name}"
      aria-pressed="${name === selected}">${iconSvg(name)}</button>`).join('');
}

function render() {
  const mine = inDeck();
  el.tallyCount.textContent = mine.length === 1 ? '1 card' : `${mine.length} cards`;
  el.drawAny.disabled = mine.length === 0;

  document.body.classList.toggle('locked', !canWrite);
  el.readonly.hidden = canWrite;
  el.lockedControls.hidden = canWrite;
  el.unlockedControls.hidden = !canWrite;
  el.deckChips.hidden = !canWrite;
  el.newDeck.hidden = !canWrite;
  el.newColumn.hidden = !canWrite;

  el.picker.innerHTML = '';
  for (const deck of decks) {
    const option = document.createElement('option');
    option.value = deck.id;
    option.textContent = deck.name;
    option.selected = deck.id === deckId;
    el.picker.append(option);
  }
  el.deleteDeck.disabled = decks.length < 2;

  const mineCols = myColumns();
  el.columns.innerHTML = '';

  mineCols.forEach((col, index) => {
    const here = inColumn(col.id);
    const section = document.createElement('section');
    section.className = 'col';
    section.dataset.column = col.id;
    section.style.setProperty('--accent', ACCENTS[index % ACCENTS.length]);
    section.innerHTML = `
      <div class="col-head">
        ${canWrite
          ? `<button class="col-icon" type="button" data-act="icon" aria-label="Change icon">${iconSvg(col.icon)}</button>`
          : `<span class="col-icon" aria-hidden="true">${iconSvg(col.icon)}</span>`}
        <span class="col-name"></span>
        <span class="col-count">${here.length}</span>
        <button class="draw-col" type="button" data-act="draw" ${here.length ? '' : 'disabled'}>Draw</button>
        ${canWrite ? `<span class="col-tools">
          <button class="tool" type="button" data-act="rename" aria-label="Rename column">${toolSvg('edit')}</button>
          <button class="tool" type="button" data-act="delete-column" aria-label="Delete column"
            ${mineCols.length < 2 ? 'disabled' : ''}>${toolSvg('remove')}</button>
        </span>` : ''}
      </div>
      ${canWrite ? `<div class="palette" hidden>${paletteMarkup(col.icon)}</div>` : ''}
      <ul class="stack" data-stack></ul>
      ${canWrite ? '<button class="add" type="button" data-act="add">Add a card</button>' : ''}`;
    section.querySelector('.col-name').textContent = col.name;

    const stack = section.querySelector('[data-stack]');
    if (!here.length) {
      const note = document.createElement('li');
      note.className = 'empty';
      note.textContent = 'Nothing here yet.';
      stack.append(note);
    } else {
      for (const card of here) {
        const li = document.createElement('li');
        li.className = 'card';
        li.dataset.id = card.id;
        li.innerHTML = canWrite
          ? `<span class="grip" draggable="true" aria-hidden="true">${toolSvg('grip')}</span>
          <span class="card-text"></span>
          <span class="card-tools">
            <button class="tool" type="button" data-act="edit" aria-label="Edit card">${toolSvg('edit')}</button>
            <button class="tool" type="button" data-act="remove" aria-label="Remove card">${toolSvg('remove')}</button>
          </span>`
          : '<span class="card-text"></span>';
        li.querySelector('.card-text').textContent = card.text;
        stack.append(li);
      }
    }

    el.columns.append(section);
  });
}

/* Columns ---------------------------------------------------------------- */

function columnOf(node) {
  const section = node.closest('.col');
  return columns.find((col) => col.id === section?.dataset.column);
}

// Swap an element for a text field, the same way adding a card works.
function askForName(anchor, { value = '', placeholder, onSave, restore }) {
  const input = document.createElement('input');
  input.className = 'field';
  input.value = value;
  input.placeholder = placeholder;
  input.setAttribute('aria-label', placeholder);
  anchor.replaceWith(input);
  input.focus();
  input.select();

  let settled = false;
  const stop = () => {
    if (settled) return;
    settled = true;
    if (restore) restore();
    else input.replaceWith(anchor);
  };

  const commit = async () => {
    if (settled) return;
    const name = input.value.trim();
    if (!name) return stop();
    settled = true;
    try {
      await onSave(name);
    } catch (err) {
      toast(err.message);
      render();
    }
  };

  input.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') return stop();
    if (event.key === 'Enter') return commit();
  });
  input.addEventListener('blur', () => setTimeout(savesOnBlur() ? commit : stop, 120));
}

// The form lives in the grid only while it is being filled in, so nothing
// permanent sits among the columns.
function startNewColumn() {
  const open = el.columns.querySelector('.col.new');
  if (open) return open.querySelector('.field').focus();

  const section = document.createElement('section');
  section.className = 'col new';
  section.style.setProperty('--accent', ACCENTS[myColumns().length % ACCENTS.length]);
  el.columns.append(section);
  openNewColumn(section);
  section.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function openNewColumn(section) {
  let icon = 'stack';
  section.innerHTML = `
    <div class="col-head">
      <span class="col-name">New column</span>
    </div>
    <div class="palette">${paletteMarkup(icon)}</div>
    <input class="field" placeholder="What kind of thing?" aria-label="Column name">
    <p class="hint">Enter to create, Escape to stop</p>`;

  const input = section.querySelector('.field');
  input.focus();

  let settled = false;
  const stop = () => {
    if (settled) return;
    settled = true;
    render();
  };

  const create = async () => {
    if (settled) return;
    const name = input.value.trim();
    if (!name) return stop();
    settled = true;
    try {
      columns.push(await api('/api/columns', {
        method: 'POST',
        body: JSON.stringify({ name, icon, deck: deckId }),
      }));
    } catch (err) {
      toast(err.message);
    }
    render();
  };

  // Clicking a swatch moves focus for a moment, so check where focus actually
  // landed before deciding the person has walked away.
  input.addEventListener('blur', () => setTimeout(() => {
    if (!section.isConnected || document.activeElement === input) return;
    if (savesOnBlur()) create();
    else stop();
  }, 150));

  section.querySelector('.palette').addEventListener('click', (event) => {
    const swatch = event.target.closest('.swatch');
    if (!swatch) return;
    icon = swatch.dataset.icon;
    for (const other of section.querySelectorAll('.swatch')) {
      other.setAttribute('aria-pressed', String(other.dataset.icon === icon));
    }
    input.focus();
  });

  input.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') return stop();
    if (event.key === 'Enter') return create();
  });
}

async function handleColumnAction(act, target) {
  const section = target.closest('.col');
  const column = columnOf(target);
  if (!column) return;

  if (act === 'draw') return draw(column.id);

  if (act === 'icon') {
    const palette = section.querySelector('.palette');
    palette.hidden = !palette.hidden;
    return;
  }

  if (act === 'rename') {
    return askForName(section.querySelector('.col-name'), {
      value: column.name,
      placeholder: 'Column name',
      restore: render,
      onSave: async (name) => {
        Object.assign(column, await api(`/api/columns/${column.id}`, {
          method: 'PATCH',
          body: JSON.stringify({ name }),
        }));
        render();
      },
    });
  }

  if (act === 'delete-column') {
    const count = inColumn(column.id).length;
    if (target.classList.contains('confirming')) {
      try {
        await api(`/api/columns/${column.id}`, { method: 'DELETE' });
        cards = cards.filter((card) => card.column !== column.id);
        columns = columns.filter((entry) => entry.id !== column.id);
      } catch (err) {
        toast(err.message);
      }
      return render();
    }

    target.classList.add('confirming');
    target.innerHTML = count ? `Delete ${count}?` : 'Delete?';
    setTimeout(() => {
      if (target.isConnected) render();
    }, 5000);
    return;
  }

  if (act === 'add') return startAdd(section, column);
}

/* Cards ------------------------------------------------------------------ */

function startEdit(li, card) {
  const slot = li.querySelector('.card-text');
  const input = document.createElement('input');
  input.className = 'field';
  input.value = card.text;
  input.setAttribute('aria-label', 'Card text');
  slot.replaceWith(input);
  input.focus();
  input.select();

  let settled = false;
  const finish = async (save) => {
    if (settled) return;
    settled = true;
    const text = input.value.trim();
    if (save && text && text !== card.text) {
      try {
        Object.assign(card, await api(`/api/cards/${card.id}`, {
          method: 'PATCH',
          body: JSON.stringify({ text }),
        }));
      } catch (err) {
        toast(err.message);
      }
    }
    render();
  };

  input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') finish(true);
    if (event.key === 'Escape') finish(false);
  });
  input.addEventListener('blur', () => finish(savesOnBlur()));
}

function startAdd(section, column) {
  const button = section.querySelector('[data-act="add"]');
  const input = document.createElement('input');
  input.className = 'field';
  input.placeholder = `Something for ${column.name}`;
  input.setAttribute('aria-label', 'New card');

  const hint = document.createElement('p');
  hint.className = 'hint';
  hint.textContent = 'Enter to add, Escape to stop';

  button.replaceWith(input);
  input.after(hint);
  input.focus();

  let settled = false;
  const stop = () => {
    if (settled) return;
    settled = true;
    hint.remove();
    input.replaceWith(button);
  };

  const save = async (text) => {
    cards.push(await api('/api/cards', {
      method: 'POST',
      body: JSON.stringify({ text, column: column.id }),
    }));
  };

  input.addEventListener('keydown', async (event) => {
    if (event.key === 'Escape') return stop();
    if (event.key !== 'Enter') return;
    const text = input.value.trim();
    if (!text) return stop();

    try {
      await save(text);
      const count = section.querySelector('.col-count');
      const stack = section.querySelector('[data-stack]');
      stack.querySelector('.empty')?.remove();

      const li = document.createElement('li');
      li.className = 'card';
      li.dataset.id = cards[cards.length - 1].id;
      li.innerHTML = `
        <span class="grip" draggable="true" aria-hidden="true">${toolSvg('grip')}</span>
        <span class="card-text"></span>
        <span class="card-tools">
          <button class="tool" type="button" data-act="edit" aria-label="Edit card">${toolSvg('edit')}</button>
          <button class="tool" type="button" data-act="remove" aria-label="Remove card">${toolSvg('remove')}</button>
        </span>`;
      li.querySelector('.card-text').textContent = text;
      stack.append(li);

      count.textContent = inColumn(column.id).length;
      section.querySelector('[data-act="draw"]').disabled = false;
      el.tallyCount.textContent = inDeck().length === 1 ? '1 card' : `${inDeck().length} cards`;
      el.drawAny.disabled = false;

      // The field stays open so several cards can be typed in a row.
      input.value = '';
      input.focus();
    } catch (err) {
      toast(err.message);
    }
  });

  // Clicking away is the end of the run, so add what is in the field and close.
  input.addEventListener('blur', () => setTimeout(async () => {
    if (settled) return;
    const text = input.value.trim();
    if (!savesOnBlur() || !text) return stop();

    settled = true;
    hint.remove();
    input.replaceWith(button);
    try {
      await save(text);
    } catch (err) {
      toast(err.message);
    }
    render();
  }, 120));
}

document.addEventListener('click', async (event) => {
  const swatch = canWrite && event.target.closest('.col:not(.new) .swatch');
  if (swatch) {
    const column = columnOf(swatch);
    try {
      Object.assign(column, await api(`/api/columns/${column.id}`, {
        method: 'PATCH',
        body: JSON.stringify({ icon: swatch.dataset.icon }),
      }));
    } catch (err) {
      toast(err.message);
    }
    return render();
  }

  const target = event.target.closest('[data-act]');
  if (!target) return;
  const act = target.dataset.act;
  if (!canWrite && act !== 'draw') return;

  if (['draw', 'icon', 'rename', 'delete-column', 'add'].includes(act)) {
    return handleColumnAction(act, target);
  }

  const li = target.closest('.card');
  const card = cards.find((entry) => entry.id === li?.dataset.id);
  if (!card) return;

  if (act === 'edit') return startEdit(li, card);

  if (act === 'remove') {
    try {
      await api(`/api/cards/${card.id}`, { method: 'DELETE' });
      cards = cards.filter((entry) => entry.id !== card.id);
      render();
    } catch (err) {
      toast(err.message);
    }
  }
});

/* Drag and drop ---------------------------------------------------------- */

// Which card the pointer sits above, so the dragged card slots in live rather
// than only landing on drop.
function cardAfter(stack, y) {
  let closest = null;
  let closestOffset = Number.NEGATIVE_INFINITY;

  for (const other of stack.querySelectorAll('.card:not(.dragging)')) {
    const box = other.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closestOffset) {
      closestOffset = offset;
      closest = other;
    }
  }
  return closest;
}

document.addEventListener('dragstart', (event) => {
  if (!canWrite) return;
  const li = event.target.closest('.grip')?.closest('.card');
  if (!li) return;

  dragging = li;
  li.classList.add('dragging');
  if (event.dataTransfer) {
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', li.dataset.id);
  }
});

document.addEventListener('dragover', (event) => {
  if (!dragging) return;
  const stack = event.target.closest('.stack');
  if (!stack) return;

  event.preventDefault();
  if (event.dataTransfer) event.dataTransfer.dropEffect = 'move';

  const after = cardAfter(stack, event.clientY);
  if (after) stack.insertBefore(dragging, after);
  else stack.append(dragging);
  stack.querySelector('.empty')?.remove();
});

document.addEventListener('drop', (event) => {
  if (dragging) event.preventDefault();
});

document.addEventListener('dragend', async () => {
  if (!dragging) return;
  dragging.classList.remove('dragging');
  dragging = null;
  await saveArrangement();
});

function readArrangement() {
  const items = [];
  for (const section of el.columns.querySelectorAll('.col:not(.new)')) {
    for (const li of section.querySelectorAll('.card')) {
      items.push({ id: li.dataset.id, column: section.dataset.column });
    }
  }
  return items;
}

// Mirror the server: the deck's cards are rewritten into the slots they already
// occupy, so cards in other decks never shift.
function applyArrangement(items) {
  const wanted = new Set(items.map((item) => item.id));
  const slots = [];
  cards.forEach((card, index) => {
    if (wanted.has(card.id)) slots.push(index);
  });

  const ordered = items.map((item) => ({
    ...cards.find((card) => card.id === item.id),
    column: item.column,
  }));
  slots.forEach((slot, index) => {
    cards[slot] = ordered[index];
  });
}

async function saveArrangement() {
  const items = readArrangement();
  const before = cards.map((card) => ({ ...card }));

  applyArrangement(items);
  render();

  try {
    await api('/api/cards/arrange', { method: 'PUT', body: JSON.stringify({ items }) });
  } catch (err) {
    cards = before;
    render();
    toast(err.message);
  }
}

/* Decks ------------------------------------------------------------------ */

function selectDeck(id) {
  deckId = id;
  savePref(PREF.deck, id);
  render();
}

function askInChip(button, { value = '', placeholder, onSave }) {
  const input = document.createElement('input');
  input.className = 'name-field';
  input.value = value;
  input.placeholder = placeholder;
  input.setAttribute('aria-label', placeholder);
  button.replaceWith(input);
  input.focus();
  input.select();

  let settled = false;
  const stop = () => {
    if (settled) return;
    settled = true;
    input.replaceWith(button);
  };

  const commit = async () => {
    if (settled) return;
    const name = input.value.trim();
    if (!name) return stop(); // nothing typed is nothing to save
    settled = true;
    input.replaceWith(button);
    try {
      await onSave(name);
    } catch (err) {
      toast(err.message);
    }
  };

  input.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') return stop();
    if (event.key === 'Enter') return commit();
  });
  input.addEventListener('blur', () => setTimeout(savesOnBlur() ? commit : stop, 120));
}

el.picker.addEventListener('change', () => selectDeck(el.picker.value));

el.newDeck.addEventListener('click', () => {
  askInChip(el.newDeck, {
    placeholder: 'Name for the new deck',
    onSave: async (name) => {
      const created = await api('/api/decks', { method: 'POST', body: JSON.stringify({ name }) });
      decks.push(created.deck);
      columns = created.columns;
      selectDeck(created.deck.id);
    },
  });
});

el.newColumn.addEventListener('click', () => {
  if (canWrite) startNewColumn();
});

el.renameDeck.addEventListener('click', () => {
  const current = decks.find((deck) => deck.id === deckId);
  askInChip(el.renameDeck, {
    value: current?.name ?? '',
    placeholder: 'New name for this deck',
    onSave: async (name) => {
      Object.assign(current, await api(`/api/decks/${deckId}`, {
        method: 'PATCH',
        body: JSON.stringify({ name }),
      }));
      render();
    },
  });
});

el.deleteDeck.addEventListener('click', async () => {
  const count = inDeck().length;

  if (!confirmingDeckDelete) {
    confirmingDeckDelete = true;
    el.deleteDeck.textContent = count
      ? `Delete deck and ${count} ${count === 1 ? 'card' : 'cards'}?`
      : 'Delete this deck?';
    setTimeout(() => {
      if (!confirmingDeckDelete) return;
      confirmingDeckDelete = false;
      el.deleteDeck.textContent = 'Delete';
    }, 5000);
    return;
  }

  confirmingDeckDelete = false;
  el.deleteDeck.textContent = 'Delete';

  try {
    await api(`/api/decks/${deckId}`, { method: 'DELETE' });
    cards = cards.filter((card) => card.deck !== deckId);
    columns = columns.filter((col) => col.deck !== deckId);
    decks = decks.filter((deck) => deck.id !== deckId);
    selectDeck(decks[0].id);
  } catch (err) {
    toast(err.message);
  }
});

/* Settings --------------------------------------------------------------- */

/* Alarm ------------------------------------------------------------------- */

// Browsers only allow sound that a person asked for, so the audio context is
// opened on the click that starts the timer and kept for later.
function openAudio() {
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return null;
  if (!audio) {
    try { audio = new Ctor(); } catch { return null; }
  }
  if (audio.state === 'suspended') audio.resume().catch(() => {});
  return audio;
}

// One soft strike: a sine with a quiet octave above it for a little shimmer, a
// slow attack and a long tail, so the note arrives rather than interrupts.
// Returns its oscillators so the chime can be stopped part way through.
function strike(ctx, out, freq, at, gain) {
  const made = [];

  for (const [ratio, share, length] of [[1, 1, 2.2], [2, 0.3, 1.6]]) {
    const level = gain * share;
    const osc = ctx.createOscillator();
    const vol = ctx.createGain();

    osc.type = 'sine';
    osc.frequency.value = freq * ratio;
    vol.gain.setValueAtTime(0.0001, at);
    vol.gain.exponentialRampToValueAtTime(level, at + 0.06);
    vol.gain.exponentialRampToValueAtTime(0.0001, at + length);

    osc.connect(vol).connect(out);
    osc.start(at);
    osc.stop(at + length + 0.1);
    made.push(osc);
  }

  return made;
}

function playChime() {
  const ctx = openAudio();
  if (!ctx) return;

  stopChime(); // never let two chimes overlap

  // Everything runs through one gain, so the whole thing can be faded at once.
  const out = ctx.createGain();
  out.gain.value = 1;
  out.connect(ctx.destination);

  const start = ctx.currentTime + 0.05;
  const oscillators = [];
  for (const [offset, gain] of PASSES) {
    for (const [freq, at] of PHRASE) {
      oscillators.push(...strike(ctx, out, freq, start + offset + at, gain));
    }
  }

  const token = {};
  ringing = { ctx, out, oscillators, token };

  // Forget it once it has finished on its own.
  const ends = start + PASSES[PASSES.length - 1][0] + PHRASE[PHRASE.length - 1][1] + 2.3;
  setTimeout(() => {
    if (ringing && ringing.token === token) ringing = null;
  }, Math.max(0, (ends - ctx.currentTime) * 1000));
}

// Cuts the sound off wherever it has got to, over 80ms so it fades rather than
// clicking. Safe to call when nothing is playing.
function stopChime() {
  if (!ringing) return;

  const { ctx, out, oscillators } = ringing;
  ringing = null;

  const now = ctx.currentTime;
  try {
    out.gain.cancelScheduledValues(now);
    out.gain.setValueAtTime(out.gain.value, now);
    out.gain.linearRampToValueAtTime(0, now + 0.08);
  } catch {}

  for (const osc of oscillators) {
    try { osc.stop(now + 0.09); } catch {}
  }
}

function setAlarm(next) {
  alarm = next;
  savePref(PREF.alarm, next);
  syncSettings();

  if (next === 'silent') return stopChime();
  if (!timer) playChime(); // hear what you chose, unless a countdown is running
}

function lengthWords() {
  return minutes === 1 ? '1 minute' : `${minutes} minutes`;
}

function clockText() {
  const m = String(Math.floor(remaining / 60)).padStart(2, '0');
  const s = String(remaining % 60).padStart(2, '0');
  return `${m}:${s}`;
}

function resetTimer() {
  // Covers closing the card, drawing another one, and pressing Reset: the
  // chime should never outlast the card it belongs to.
  stopChime();
  clearInterval(timer);
  timer = null;
  deadline = null;
  remaining = minutes * 60;
  el.clock.hidden = true;
  el.clock.classList.remove('rang');
  el.clock.textContent = clockText();
  el.doneNote.hidden = true;
  el.doneNote.textContent = `That is ${lengthWords()}. Carry on or stop, either is fine.`;
  el.timerBtn.textContent = `Start ${lengthWords()}`;
}

function buildChips() {
  for (const preset of PRESETS) {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.type = 'button';
    chip.dataset.min = preset;
    chip.textContent = preset;
    chip.setAttribute('aria-label', `${preset} minutes`);
    chip.addEventListener('click', () => setMinutes(preset));
    el.chips.append(chip);
  }

  for (const [value, label] of ALARMS) {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.type = 'button';
    chip.dataset.alarm = value;
    chip.textContent = label;
    chip.addEventListener('click', () => setAlarm(value));
    el.alarms.append(chip);
  }

  for (const [value, label] of CLICKAWAYS) {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.type = 'button';
    chip.dataset.clickaway = value;
    chip.textContent = label;
    chip.addEventListener('click', () => setClickAway(value));
    el.clickaways.append(chip);
  }

  for (const [value, label] of THEMES) {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.type = 'button';
    chip.dataset.theme = value;
    chip.textContent = label;
    chip.addEventListener('click', () => setTheme(value));
    el.themes.append(chip);
  }
}

function syncSettings() {
  for (const chip of el.chips.children) {
    chip.setAttribute('aria-pressed', String(Number(chip.dataset.min) === minutes));
  }
  for (const chip of el.alarms.children) {
    chip.setAttribute('aria-pressed', String(chip.dataset.alarm === alarm));
  }

  // The card's toggle and the settings chips are two views of one setting.
  const on = alarm === 'chime';
  el.sheetAlarm.setAttribute('aria-pressed', String(on));
  el.sheetAlarmIcon.innerHTML = svg(on ? BELL : BELL_OFF);
  el.sheetAlarmText.textContent = on ? 'Alarm on' : 'Alarm off';
  for (const chip of el.themes.children) {
    chip.setAttribute('aria-pressed', String(chip.dataset.theme === theme));
  }
  for (const chip of el.clickaways.children) {
    chip.setAttribute('aria-pressed', String(chip.dataset.clickaway === clickAway));
  }
  if (document.activeElement !== el.custom) el.custom.value = minutes;
}

function setMinutes(next) {
  const value = Number(next);
  if (!Number.isInteger(value) || value < 1 || value > 180) {
    return toast('Pick a whole number of minutes between 1 and 180.');
  }
  minutes = value;
  savePref(PREF.minutes, value);
  resetTimer();
  syncSettings();
}

function setClickAway(next) {
  clickAway = next;
  savePref(PREF.clickAway, next);
  syncSettings();
}

function setTheme(next) {
  theme = next;
  document.documentElement.dataset.theme = next;
  savePref(PREF.theme, next);
  syncSettings();
}

/* Write mode ------------------------------------------------------------- */

async function unlock() {
  const password = el.password.value;
  if (!password) return;

  el.unlock.disabled = true;
  try {
    const result = await api('/api/unlock', { method: 'POST', body: JSON.stringify({ password }) });
    canWrite = Boolean(result.canWrite);
    el.password.value = '';
    render();
    toast('Write mode is on.');
  } catch (err) {
    toast(err.message);
  } finally {
    el.unlock.disabled = false;
  }
}

el.unlock.addEventListener('click', unlock);
el.password.addEventListener('keydown', (event) => {
  if (event.key === 'Enter') unlock();
});

el.lock.addEventListener('click', async () => {
  try {
    await api('/api/lock', { method: 'POST' });
    canWrite = false;
    render();
    toast('Write mode is off.');
  } catch (err) {
    toast(err.message);
  }
});

el.sheetAlarm.addEventListener('click', () => {
  setAlarm(alarm === 'chime' ? 'silent' : 'chime');
});

el.cog.addEventListener('click', () => {
  const open = el.settings.hidden;
  el.settings.hidden = !open;
  el.cog.setAttribute('aria-expanded', String(open));
  if (open) syncSettings();
});

el.custom.addEventListener('change', () => setMinutes(el.custom.value));
el.custom.addEventListener('keydown', (event) => {
  if (event.key === 'Enter') setMinutes(el.custom.value);
});

/* Drawing ---------------------------------------------------------------- */

function draw(columnId) {
  let pool = columnId ? inColumn(columnId) : inDeck();
  if (!pool.length) return;
  if (pool.length > 1) pool = pool.filter((card) => card.id !== lastDrawnId);

  const card = pool[Math.floor(Math.random() * pool.length)];
  lastDrawnId = card.id;
  show(card);
}

function show(card) {
  const column = columns.find((col) => col.id === card.column);
  const index = myColumns().findIndex((col) => col.id === card.column);

  resetTimer();
  el.drawnText.textContent = card.text;
  el.drawnMode.textContent = column?.name ?? '';
  el.drawnIcon.innerHTML = iconSvg(column?.icon);
  el.drawn.style.setProperty('--accent', ACCENTS[Math.max(index, 0) % ACCENTS.length]);
  el.drawn.style.animation = 'none';
  void el.drawn.offsetWidth;
  el.drawn.style.animation = '';
  el.sheet.hidden = false;
  el.close.focus();
}

function ring() {
  clearInterval(timer);
  timer = null;
  deadline = null;
  remaining = 0;
  el.clock.textContent = clockText();
  el.clock.classList.add('rang');
  el.doneNote.hidden = false;
  el.timerBtn.textContent = 'Reset';
  if (alarm === 'chime') playChime();
}

// Worked out from the clock rather than by counting intervals, because a
// background tab has its timers throttled and the countdown would otherwise
// finish late by however long you were away.
function tick() {
  const left = Math.max(0, Math.round((deadline - Date.now()) / 1000));
  if (left === remaining) return;

  remaining = left;
  el.clock.textContent = clockText();
  if (remaining === 0) ring();
}

el.timerBtn.addEventListener('click', () => {
  if (timer) {
    clearInterval(timer);
    timer = null;
    deadline = null;
    el.timerBtn.textContent = 'Resume';
    return;
  }
  if (remaining === 0) return resetTimer();

  // This click is the permission the browser needs to make a sound later on.
  if (alarm === 'chime') openAudio();

  el.clock.hidden = false;
  el.clock.classList.remove('rang');
  el.doneNote.hidden = true;
  el.clock.textContent = clockText();
  el.timerBtn.textContent = 'Pause';

  deadline = Date.now() + remaining * 1000;
  timer = setInterval(tick, 250);
});

// Coming back to a throttled tab should show the right time straight away.
document.addEventListener('visibilitychange', () => {
  if (timer) tick();
});

function closeSheet() {
  resetTimer();
  el.sheet.hidden = true;
  el.drawAny.focus();
}

el.drawAny.addEventListener('click', () => draw(null));
el.again.addEventListener('click', () => draw(null));
el.close.addEventListener('click', closeSheet);
el.sheet.addEventListener('click', (event) => {
  if (event.target === el.sheet) closeSheet();
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && !el.sheet.hidden) closeSheet();
});

/* Start ------------------------------------------------------------------ */

buildChips();

// Preferences are already known, so the page can settle into the right theme
// and timer before the deck arrives.
document.documentElement.dataset.theme = theme;
resetTimer();
syncSettings();

api('/api/state')
  .then((state) => {
    // A reply missing any of this comes from an older version of the server.
    // Say so here rather than failing later on with something cryptic.
    const shapeOk = state
      && Array.isArray(state.cards)
      && Array.isArray(state.decks) && state.decks.length
      && Array.isArray(state.columns) && state.columns.length;

    if (!shapeOk) {
      throw new Error('The server did not send a full deck, so it is running an older version than this page. Redeploy it.');
    }

    if (state.build !== BUILD) {
      toast(`This page is ${BUILD} and the server is ${state.build ?? 'older'}. One of them needs redeploying.`);
    }

    cards = state.cards;
    decks = state.decks;
    columns = state.columns;
    canWrite = Boolean(state.canWrite);

    // The deck this machine was last on, unless it has since been deleted.
    if (!decks.some((deck) => deck.id === deckId)) deckId = decks[0].id;
    savePref(PREF.deck, deckId);

    render();
  })
  .catch((err) => {
    el.tallyCount.textContent = 'Deck not loaded';
    el.drawAny.disabled = true;
    document.body.classList.add('locked');
    toast(err.message);
  });
</script>
</body>
